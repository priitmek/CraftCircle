name: Publish CraftCircle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.4.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Package and publish Forever release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fxq "## Version: $version" CraftCircle/CraftCircle.toc
          notes=$(mktemp)
          if [[ -f CHANGELOG.md ]]; then
            awk -v heading="## $version" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$notes"
          fi
          asset="CraftCircle-$version-forever.zip"
          zip -qr "$asset" CraftCircle
          unzip -tq "$asset"
          if existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null); then
            if ! grep -Fxq "$asset" <<< "$existing"; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          else
            if grep -q '[^[:space:]]' "$notes"; then
              gh release create "$RELEASE_TAG" "$asset" --verify-tag --notes-file "$notes" --title "CraftCircle $version"
            else
              gh release create "$RELEASE_TAG" "$asset" --verify-tag --generate-notes --title "CraftCircle $version"
            fi
          fi
