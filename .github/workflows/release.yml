name: Publish CraftCircle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package and publish Forever release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fxq "## Version: $version" CraftCircle/CraftCircle.toc
          asset="CraftCircle-$version-forever.zip"
          zip -qr "$asset" CraftCircle
          unzip -tq "$asset"
          gh release create "$RELEASE_TAG" "$asset" --verify-tag --generate-notes --title "CraftCircle $version"
